    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const STATIC = params.get('static') === '1';
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

const C = { paper: 0xF6F7FB, white: 0xFFFFFF, ink: 0x0B1026, blue: 0x3B4CFF, blue300: 0x8B96FF, amber: 0xFFB21E };
const M = {
  white: new THREE.MeshStandardMaterial({ color: C.white, roughness: 0.55 }),
  paper: new THREE.MeshStandardMaterial({ color: C.paper, roughness: 0.9 }),
  ink: new THREE.MeshStandardMaterial({ color: C.ink, roughness: 0.45 }),
  blue: new THREE.MeshStandardMaterial({ color: C.blue, roughness: 0.4 }),
  blue300: new THREE.MeshStandardMaterial({ color: C.blue300, roughness: 0.5 }),
  amber: new THREE.MeshStandardMaterial({ color: C.amber, roughness: 0.5 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.1, transparent: true, opacity: 0.32 }),
  filament: new THREE.MeshStandardMaterial({ color: C.amber, emissive: C.amber, emissiveIntensity: 1.2, roughness: 0.3 }),
  dot: new THREE.MeshStandardMaterial({ color: 0xFFFFFF, emissive: 0xFFFFFF, emissiveIntensity: 0.9 }),
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(2.6, 1.9, 4.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableZoom = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minPolarAngle = 0.7;
controls.maxPolarAngle = 1.35;
controls.autoRotate = !STATIC && !reduced.matches;
controls.autoRotateSpeed = 0.55;
controls.enabled = !STATIC;
reduced.addEventListener('change', () => { controls.autoRotate = !STATIC && !reduced.matches; });

// lighting
scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xD9DCEA, 1.2));
const key = new THREE.DirectionalLight(0xFFFFFF, 2.2);
key.position.set(3, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -3.5;
key.shadow.camera.right = key.shadow.camera.top = 3.5;
key.shadow.radius = 6;
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xFFFFFF, 0.6);
fill.position.set(-4, 2, -2);
scene.add(fill);

// ground shadow catcher
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.4;
ground.receiveShadow = true;
scene.add(ground);

const add = (geo, mat, x, y, z, parent = scene) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
};

// bench
const bench = add(new THREE.BoxGeometry(3.4, 0.14, 2.0), M.white, 0, -0.07, 0);
bench.receiveShadow = true;
const legG = new THREE.BoxGeometry(0.1, 0.26, 0.1);
[[-1.55, -0.85], [1.55, -0.85], [-1.55, 0.85], [1.55, 0.85]].forEach(([x, z]) => add(legG, M.paper, x, -0.27, z));
// paper mat on bench
add(new THREE.BoxGeometry(2.9, 0.01, 1.5), M.paper, 0, 0.005, 0);

// ---- LAB 1: electricity ----
const labE = new THREE.Group(); scene.add(labE);
// battery (left)
const battery = new THREE.Group(); battery.position.set(-1.05, 0, 0.1); labE.add(battery);
add(new THREE.BoxGeometry(0.42, 0.55, 0.28), M.ink, 0, 0.285, 0, battery);
add(new THREE.BoxGeometry(0.42, 0.06, 0.28), M.amber, 0, 0.53, 0, battery);
add(new THREE.CylinderGeometry(0.04, 0.04, 0.1, 16), M.blue300, -0.12, 0.61, 0, battery);
add(new THREE.CylinderGeometry(0.04, 0.04, 0.1, 16), M.blue300, 0.12, 0.61, 0, battery);
const batPlus = new THREE.Vector3(-1.17, 0.66, 0.1), batMinus = new THREE.Vector3(-0.93, 0.66, 0.1);

// resistor (back center)
const resistor = new THREE.Group(); resistor.position.set(0.1, 0.16, -0.55); labE.add(resistor);
const rBody = add(new THREE.CylinderGeometry(0.11, 0.11, 0.6, 32), M.ink, 0, 0, 0, resistor);
rBody.rotation.z = Math.PI / 2;
[[-0.16, M.amber], [-0.05, M.ink], [0.06, M.blue300], [0.19, M.blue]].forEach(([x, mat]) => {
  const b = add(new THREE.CylinderGeometry(0.118, 0.118, 0.06, 32), mat === M.ink ? M.white : mat, x, 0, 0, resistor);
  b.rotation.z = Math.PI / 2;
});
const leadG = new THREE.CylinderGeometry(0.018, 0.018, 0.22, 12);
[-0.41, 0.41].forEach(x => { const l = add(leadG, M.blue300, x, 0, 0, resistor); l.rotation.z = Math.PI / 2; });
// stands
add(new THREE.BoxGeometry(0.06, 0.16, 0.14), M.paper, -0.3, -0.08, 0, resistor);
add(new THREE.BoxGeometry(0.06, 0.16, 0.14), M.paper, 0.3, -0.08, 0, resistor);
const resL = new THREE.Vector3(-0.42, 0.16, -0.55), resR = new THREE.Vector3(0.62, 0.16, -0.55);

// bulb (right)
const bulbG = new THREE.Group(); bulbG.position.set(1.05, 0, -0.05); labE.add(bulbG);
add(new THREE.CylinderGeometry(0.2, 0.24, 0.16, 32), M.ink, 0, 0.08, 0, bulbG);
add(new THREE.CylinderGeometry(0.12, 0.12, 0.22, 32), M.blue300, 0, 0.27, 0, bulbG);
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.28, 40, 32), M.glass);
glass.position.set(0, 0.62, 0); bulbG.add(glass);
const filament = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), M.filament);
filament.position.set(0, 0.6, 0); bulbG.add(filament);
const bulbLight = new THREE.PointLight(C.amber, 3, 2.5, 2);
bulbLight.position.set(0, 0.62, 0); bulbG.add(bulbLight);
const haloTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,178,30,0.9)'); grd.addColorStop(0.4, 'rgba(255,178,30,0.35)'); grd.addColorStop(1, 'rgba(255,178,30,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false, opacity: 0.8 }));
halo.position.set(0, 0.62, 0); halo.scale.setScalar(1.4); bulbG.add(halo);
const bulbA = new THREE.Vector3(0.78, 0.16, 0.02), bulbB = new THREE.Vector3(1.32, 0.16, 0.02);

// ammeter (front center)
const meter = new THREE.Group(); meter.position.set(0.05, 0, 0.55); labE.add(meter);
add(new THREE.BoxGeometry(0.62, 0.42, 0.26), M.ink, 0, 0.21, 0, meter);
const face = add(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 40), M.white, 0, 0.24, 0.135, meter);
face.rotation.x = Math.PI / 2;
const arc = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.006, 8, 40, Math.PI * 0.9), M.ink);
arc.position.set(0, 0.2, 0.146); arc.rotation.z = Math.PI * 0.05; meter.add(arc);
const needle = new THREE.Group(); needle.position.set(0, 0.2, 0.15); meter.add(needle);
add(new THREE.BoxGeometry(0.012, 0.13, 0.008), M.blue, 0, 0.065, 0, needle);
add(new THREE.CylinderGeometry(0.02, 0.02, 0.012, 16), M.blue, 0, 0, 0, needle).rotation.x = Math.PI / 2;
add(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 16), M.blue300, -0.2, 0.46, 0, meter);
add(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 16), M.blue300, 0.2, 0.46, 0, meter);
const metL = new THREE.Vector3(-0.15, 0.5, 0.55), metR = new THREE.Vector3(0.25, 0.5, 0.55);

// wires: battery+ -> resistor L ; resistor R -> bulb A ; bulb B -> meter R ; meter L -> battery-
const wire = (a, b, lift, via) => {
  const mid = via ? via.clone() : a.clone().add(b).multiplyScalar(0.5); if (!via) mid.y = Math.max(a.y, b.y) + lift;
  const curve = new THREE.CatmullRomCurve3([a, a.clone().lerp(mid, 0.25).setY(a.y + lift * 0.6), mid, b.clone().lerp(mid, 0.25).setY(b.y + lift * 0.6), b]);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.024, 12, false), M.blue);
  mesh.castShadow = true; labE.add(mesh);
  return curve;
};
const curves = [wire(batPlus, resL, 0.55), wire(resR, bulbA, 0.22, new THREE.Vector3(0.7, 0.42, -0.3)), wire(bulbB, metR, 0.3, new THREE.Vector3(1.25, 0.5, 0.6)), wire(metL, batMinus, 0.45)];

// flowing dots
const dots = [];
const dotG = new THREE.SphereGeometry(0.036, 12, 10);
curves.forEach((c, ci) => { for (let i = 0; i < 4; i++) { const d = new THREE.Mesh(dotG, M.dot); d.userData = { c: ci, t: i / 4 }; labE.add(d); dots.push(d); } });


// ---- LAB 2: pendulum ----
const labP = new THREE.Group(); scene.add(labP);
add(new THREE.BoxGeometry(0.7, 0.08, 0.5), M.ink, 0, 0.04, 0, labP);
add(new THREE.CylinderGeometry(0.035, 0.035, 1.5, 16), M.ink, 0, 0.83, -0.2, labP);
const pArm = add(new THREE.BoxGeometry(0.06, 0.06, 0.5), M.ink, 0, 1.58, 0.02, labP);
const pivot = new THREE.Group(); pivot.position.set(0, 1.55, 0.24); labP.add(pivot);
const pString = add(new THREE.CylinderGeometry(0.008, 0.008, 1, 8), M.blue300, 0, -0.5, 0, pivot);
const pBall = add(new THREE.SphereGeometry(0.12, 32, 24), M.blue, 0, -1, 0, pivot);
// timer display
const timerG = new THREE.Group(); timerG.position.set(0.95, 0, 0.45); labP.add(timerG);
add(new THREE.BoxGeometry(0.5, 0.3, 0.2), M.ink, 0, 0.15, 0, timerG);
add(new THREE.BoxGeometry(0.36, 0.14, 0.02), M.paper, 0, 0.17, 0.1, timerG);
const timerBar = add(new THREE.BoxGeometry(0.3, 0.04, 0.01), M.amber, 0, 0.17, 0.115, timerG);

// ---- LAB 3: springs ----
const labS = new THREE.Group(); scene.add(labS);
add(new THREE.BoxGeometry(0.7, 0.08, 0.5), M.ink, 0, 0.04, 0, labS);
add(new THREE.CylinderGeometry(0.035, 0.035, 1.5, 16), M.ink, 0, 0.83, -0.2, labS);
add(new THREE.BoxGeometry(0.06, 0.06, 0.5), M.ink, 0, 1.58, 0.02, labS);
const springTop = 1.55;
const springG = new THREE.Group(); springG.position.set(0, springTop, 0.24); labS.add(springG);
let springMesh = null;
const buildSpring = (len) => {
  if (springMesh) { springG.remove(springMesh); springMesh.geometry.dispose(); }
  const pts = []; const coils = 12, N = 240;
  for (let i = 0; i <= N; i++) { const u = i / N; pts.push(new THREE.Vector3(Math.cos(u * coils * Math.PI * 2) * 0.09, -u * len, Math.sin(u * coils * Math.PI * 2) * 0.09)); }
  springMesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, 0.014, 8, false), M.blue300);
  springMesh.castShadow = true; springG.add(springMesh);
};
buildSpring(0.45 + (0.5 * 9.8 / 50) * 2.4);
const weight = add(new THREE.CylinderGeometry(0.14, 0.14, 0.2, 32), M.ink, 0, -0.7, 0, springG);
add(new THREE.CylinderGeometry(0.02, 0.02, 0.06, 8), M.blue300, 0, 0.13, 0, weight);
// ruler
const ruler = new THREE.Group(); ruler.position.set(0.42, 0.75, 0.24); labS.add(ruler);
add(new THREE.BoxGeometry(0.12, 1.5, 0.03), M.white, 0, 0, 0, ruler);
for (let i = 0; i <= 14; i++) add(new THREE.BoxGeometry(i % 5 === 0 ? 0.07 : 0.04, 0.008, 0.005, 1), M.ink, -0.025 + (i % 5 === 0 ? 0 : 0.015), 0.7 - i * 0.1, 0.018, ruler);
const restMarker = add(new THREE.BoxGeometry(0.16, 0.012, 0.01), M.amber, 0, 0, 0.02, labS); restMarker.position.set(0.42, springTop - 0.45 - 0.2, 0.26);

// ---- LAB 4: optics ----
const labO = new THREE.Group(); scene.add(labO);
const blockMat = new THREE.MeshStandardMaterial({ color: 0xC9CEFF, roughness: 0.05, transparent: true, opacity: 0.4 });
const block = add(new THREE.BoxGeometry(1.2, 0.3, 0.9), blockMat, 0.3, 0.16, 0, labO);
block.castShadow = false;
add(new THREE.BoxGeometry(1.2, 0.01, 0.9), M.white, 0.3, 0.012, 0, labO);
// laser body
const laser = new THREE.Group(); labO.add(laser);
add(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 20), M.ink, 0, 0, 0, laser).rotation.z = Math.PI / 2;
add(new THREE.CylinderGeometry(0.03, 0.03, 0.06, 16), M.amber, 0.22, 0, 0, laser).rotation.z = Math.PI / 2;
const beamMat = new THREE.MeshStandardMaterial({ color: 0xD9452B, emissive: 0xD9452B, emissiveIntensity: 1.5 });
const beamIn = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), beamMat); labO.add(beamIn);
const beamMid = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), beamMat); labO.add(beamMid);
const beamOut = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1, 8), beamMat); labO.add(beamOut);
const normalLine = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.006, 0.006), M.blue300); normalLine.position.set(-0.3, 0.16, 0); labO.add(normalLine);
add(new THREE.BoxGeometry(0.16, 0.14, 0.16), M.paper, 0, -0.09, 0, laser); // laser stand
let arcIn = null, arcOut = null;
const mkArc = (from, to, mat) => {
  const pts = []; for (let i = 0; i <= 24; i++) { const a = from + (to - from) * i / 24; pts.push(new THREE.Vector3(Math.cos(a) * 0.3, 0, Math.sin(a) * 0.3)); }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.01, 6, false), mat); return m;
};
const placeBeam = (mesh, a, b) => { const d = b.clone().sub(a); mesh.position.copy(a).add(b).multiplyScalar(0.5); mesh.scale.set(1, d.length(), 1); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); };
const setOptics = (deg) => {
  const th1 = deg * Math.PI / 180, th2 = Math.asin(Math.sin(th1) / 1.5);
  const y = 0.16; const P = new THREE.Vector3(-0.3, y, 0);
  const dirIn = new THREE.Vector3(Math.cos(th1), 0, Math.sin(th1));
  const A = P.clone().addScaledVector(dirIn, -1.1);
  laser.position.copy(A); laser.rotation.y = -th1; laser.position.y = y; 
  placeBeam(beamIn, A.clone().addScaledVector(dirIn, 0.22), P);
  const dirMid = new THREE.Vector3(Math.cos(th2), 0, Math.sin(th2));
  const Q = P.clone().addScaledVector(dirMid, 1.2 / Math.cos(th2));
  placeBeam(beamMid, P, Q);
  placeBeam(beamOut, Q, Q.clone().addScaledVector(dirIn, 1.0));
  if (arcIn) { labO.remove(arcIn); labO.remove(arcOut); arcIn.geometry.dispose(); arcOut.geometry.dispose(); }
  arcIn = mkArc(Math.PI, Math.PI + th1, M.amber); arcIn.position.copy(P); labO.add(arcIn);   // between -x axis (normal) and incoming ray source side
  arcOut = mkArc(0, th2, M.blue); arcOut.position.copy(P); labO.add(arcOut);
};

// ---- LAB 5: chemistry preview ----
const labC = new THREE.Group(); scene.add(labC);
const beakerMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.05, transparent: true, opacity: 0.28, side: THREE.DoubleSide });
const beaker = add(new THREE.CylinderGeometry(0.42, 0.38, 0.9, 40, 1, true), beakerMat, 0, 0.45, 0, labC); beaker.castShadow = false;
add(new THREE.CylinderGeometry(0.38, 0.38, 0.02, 40), beakerMat, 0, 0.01, 0, labC).castShadow = false;
const liquidMat = new THREE.MeshStandardMaterial({ color: 0x2EAA5B, roughness: 0.3, transparent: true, opacity: 0.85 });
const liquid = add(new THREE.CylinderGeometry(0.39, 0.37, 0.55, 40), liquidMat, 0, 0.285, 0, labC);
// pH indicator strip
const strip = new THREE.Group(); strip.position.set(0.85, 0, 0.3); labC.add(strip);
add(new THREE.BoxGeometry(0.5, 0.06, 0.34), M.white, 0, 0.03, 0, strip);
add(new THREE.BoxGeometry(0.42, 0.02, 0.1), M.paper, 0, 0.07, 0, strip);
const stripPad = add(new THREE.BoxGeometry(0.1, 0.03, 0.1), liquidMat, -0.14, 0.08, 0, strip);
const phColor = (ph) => { const c = new THREE.Color(); if (ph <= 7) c.setHSL(0.33 * ((ph - 1) / 6), 0.72, 0.42); else c.setHSL(0.33 + (0.78 - 0.33) * ((ph - 7) / 7), 0.6, 0.42); return c; };
const glassRod = add(new THREE.CylinderGeometry(0.02, 0.02, 1.1, 12), beakerMat, 0.15, 0.6, 0.1, labC); glassRod.rotation.z = -0.3; glassRod.castShadow = false;

const LABS = { electricity: labE, pendulum: labP, springs: labS, optics: labO, chemistry: labC };
let lab = params.get('lab') || 'electricity';
if (!LABS[lab]) lab = 'electricity';
const setLab = (name) => { if (!LABS[name]) return; lab = name; Object.entries(LABS).forEach(([k, g]) => { g.visible = k === name; }); };
setLab(lab);

// per-lab params
let L = 1.0, mass = 0.5, angleIn = 30, pH = 7;
const setVal = (v) => {
  v = Number(v);
  if (lab === 'electricity') setR(v);
  else if (lab === 'pendulum') L = Math.min(2, Math.max(0.25, v || 1));
  else if (lab === 'springs') mass = Math.min(1, Math.max(0.1, v || 0.5));
  else if (lab === 'optics') angleIn = Math.min(80, Math.max(0, isNaN(v) ? 30 : v));
  else if (lab === 'chemistry') pH = Math.min(14, Math.max(1, v || 7));
};

// state
let R = 10;
const setR = (v) => { R = Math.min(30, Math.max(5, Number(v) || 10)); };
addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.type === 'resistance') setR(d.value);
  else if (d.type === 'lab') { setLab(d.lab); if (d.value != null) setVal(d.value); }
  else if (d.type === 'value') setVal(d.value);
});
if (params.get('r')) setR(params.get('r'));
if (params.get('v')) setVal(params.get('v'));

const resize = () => {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const d = camera.aspect < 1.4 ? 6.2 + (1.4 - camera.aspect) * 3 : 5.9;
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, d);
};
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let phase = 0, pendT = 0, curLen = 0.45 + (0.5 * 9.8 / 50) * 2.4, builtLen = -1, builtAngle = -1;
const tick = () => { try {
  const dt = clock.getDelta();
  const I = 6 / R, k = I / 1.2;
  M.filament.emissiveIntensity = 0.3 + k * 1.6;
  bulbLight.intensity = 0.3 + k * 4;
  halo.material.opacity = 0.1 + k * 0.7;
  halo.scale.setScalar(0.7 + k * 1.0);
  const targetRot = 1.2 - k * 2.4;
  needle.rotation.z += (targetRot - needle.rotation.z) * Math.min(1, dt * 6);
  if (!reduced.matches) phase += dt * (0.08 + I * 0.5);
  dots.forEach(d => {
    const t = (d.userData.t + phase) % 1;
    d.position.copy(curves[d.userData.c].getPointAt(t));
  });
  // pendulum
  const T = 2 * Math.PI * Math.sqrt(L / 9.8);
  pendT += dt;
  const swing = reduced.matches ? 0.35 : 0.35 * Math.sin(pendT * 2 * Math.PI / T);
  pivot.rotation.z = swing;
  const Lv = L * 0.62;
  pString.scale.y = Lv; pString.position.y = -Lv / 2; pBall.position.y = -Lv - 0.1;
  timerBar.scale.x = 0.2 + 0.8 * Math.abs(Math.sin(pendT * Math.PI / T));
  // springs
  const stretch = (mass * 9.8) / 50; // m
  const targetLen = 0.45 + stretch * 2.4; // visual scale
  curLen += (targetLen - curLen) * Math.min(1, dt * 5);
  if (Math.abs(curLen - builtLen) > 0.004) { buildSpring(curLen); builtLen = curLen; }
  weight.position.y = -curLen - 0.1;
  weight.scale.setScalar(0.7 + mass * 0.5);
  // optics
  if (Math.abs(angleIn - builtAngle) > 0.01) { setOptics(angleIn); builtAngle = angleIn; }
  // chemistry
  liquidMat.color.copy(phColor(pH));
  controls.update();
  renderer.render(scene, camera);
  } catch (err) { renderer.setAnimationLoop(null); document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;top:0;left:0;background:#000;color:#fff;padding:8px;font:12px monospace">' + (err.stack || err) + '</pre>'); }
};
tick();
renderer.setAnimationLoop(tick);
// rAF can stall in background/offscreen frames; keep a slow fallback so the scene is never blank
let lastFrame = renderer.info.render.frame;
setInterval(() => { if (renderer.info.render.frame === lastFrame) tick(); lastFrame = renderer.info.render.frame; }, 250);
</script>
